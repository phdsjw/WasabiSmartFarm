# ================================================
# 와사비 수위 센서 (Node 20) - HA mqtt.yaml 추가 항목
# ================================================
# 위치: /config/mqtt.yaml 의 sensor: 블록 마지막에 추가
#
# 발행 토픽  : sensor/water_tank/data
# 발행 JSON  : {
#                "node_id": "20",
#                "node_type": "water_level",
#                "water_level_percent": 75.3,
#                "distance_cm": 29.2,
#                "water_level_cm": 75.8,
#                "rssi": -62,
#                "timestamp": 123456789
#              }
# 상태 토픽  : sensor/water_level/status  ("online" / "offline")
# ================================================

  # ─── 수위 퍼센트 (%) ─────────────────────────
  - name: "와사비 수위"
    unique_id: "wasabi_water_level_percent"
    state_topic: "sensor/water_tank/data"
    value_template: "{{ value_json.water_level_percent | round(1) }}"
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:water-percent
    availability_topic: "sensor/water_level/status"
    payload_available: "online"
    payload_not_available: "offline"

  # ─── 수위 높이 (cm) ──────────────────────────
  - name: "와사비 수위 높이"
    unique_id: "wasabi_water_level_cm"
    state_topic: "sensor/water_tank/data"
    value_template: "{{ value_json.water_level_cm | round(1) }}"
    unit_of_measurement: "cm"
    state_class: measurement
    icon: mdi:waves-arrow-up
    availability_topic: "sensor/water_level/status"
    payload_available: "online"
    payload_not_available: "offline"

  # ─── 센서-수면 거리 (cm, 진단용) ─────────────
  - name: "와사비 수위 센서 거리"
    unique_id: "wasabi_water_distance_cm"
    state_topic: "sensor/water_tank/data"
    value_template: "{{ value_json.distance_cm | round(1) }}"
    unit_of_measurement: "cm"
    state_class: measurement
    icon: mdi:ruler
    availability_topic: "sensor/water_level/status"
    payload_available: "online"
    payload_not_available: "offline"
