# ========================================
# 와사비 스마트팜 - 템플릿 센서 설정
# ========================================
# 18개 토양 센서의 평균값 계산
# 최소 12개 센서 유효 데이터 필요
# ========================================

sensor:
  - name: "wasabi_air_temp_avg"
    unique_id: "wasabi_air_temp_avg"
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:thermometer
    state: >
      {% set sensors = [
        states('sensor.wasabi_g1_01_air_temp'),
        states('sensor.wasabi_g1_02_air_temp'),
        states('sensor.wasabi_g1_03_air_temp')
      ] %}
      {% set valid = sensors | select('is_number') | list %}
      {% if valid | length >= 2 %}
        {{ (valid | map('float') | sum / valid | length) | round(1) }}
      {% else %}
        unavailable
      {% endif %}

  - name: "wasabi_air_humidity_avg"
    unique_id: "wasabi_air_humidity_avg"
    unit_of_measurement: "%"
    device_class: humidity
    icon: mdi:water-percent
    state: >
      {% set sensors = [
        states('sensor.wasabi_g1_01_air_humidity'),
        states('sensor.wasabi_g1_02_air_humidity'),
        states('sensor.wasabi_g1_03_air_humidity')
      ] %}
      {% set valid = sensors | select('is_number') | list %}
      {% if valid | length >= 2 %}
        {{ (valid | map('float') | sum / valid | length) | round(1) }}
      {% else %}
        unavailable
      {% endif %}

