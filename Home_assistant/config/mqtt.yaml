# ================================================
# g5 - 밸브 제어 (g5-01)
# ================================================
switch:
  - name: "g5 수조 뺄브"
    unique_id: wasabi_g5_01_valve
    command_topic: "smartfarm/wasabi/g5_water_level_valve/g5-01/valve/cmd"
    state_topic: "smartfarm/wasabi/g5_water_level_valve/g5-01/valve/state"
    value_template: "{{ value_json.valve }}"
    payload_on: "on"
    payload_off: "off"
    state_on: "on"
    state_off: "off"
    icon: mdi:valve
    optimistic: false
    availability_topic: "smartfarm/wasabi/g5_water_level_valve/g5-01/heartbeat"
    payload_available: "alive"

