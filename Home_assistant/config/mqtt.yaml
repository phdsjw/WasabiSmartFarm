# ================================================
# 비상 정지 버튼
# ================================================
button:
  - name: "비상 정지"
    unique_id: wasabi_emergency_stop
    command_topic: "smartfarm/wasabi/g6_pump_ctrl/g6-01/cmd/emergency_stop"
    payload_press: ""
    icon: mdi:alert-octagon

  - name: "비상 정지 해제"
    unique_id: wasabi_emergency_release
    command_topic: "smartfarm/wasabi/g6_pump_ctrl/g6-01/cmd/emergency_release"
    payload_press: "RELEASED"
    icon: mdi:check-circle
