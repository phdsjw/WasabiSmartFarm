# ========================================
# 와사비 스마트팜 - MQTT 센서/스위치 설정 (g1~g7)
# ========================================
# 버전: v2.0.0 (g1~g7 토픽 구조)
# 작성일: 2026-02-25
# ========================================

# ================================================
# g1 - 대기 온습도 센서 (g1-01)
# ================================================
sensor:
  - name: "g1 대기 온도"
    unique_id: wasabi_g1_01_air_temp
    state_topic: "smartfarm/wasabi/g1_air_soil/g1-01/air/data"
    value_template: "{{ value_json.air_temp | round(1) }}"
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:thermometer
    availability_topic: "smartfarm/wasabi/g1_air_soil/g1-01/heartbeat"
    payload_available: "alive"
    value_template_availability: "{{ value_json.status }}"

  - name: "g1 대기 습도"
    unique_id: wasabi_g1_01_air_humidity
    state_topic: "smartfarm/wasabi/g1_air_soil/g1-01/air/data"
    value_template: "{{ value_json.air_humidity | round(1) }}"
    unit_of_measurement: "%"
    device_class: humidity
    icon: mdi:water-percent
    availability_topic: "smartfarm/wasabi/g1_air_soil/g1-01/heartbeat"
    payload_available: "alive"
    value_template_availability: "{{ value_json.status }}"

