title: 와사비 스마트팜
theme: default
views:
  - title: Overview
    path: overview
    icon: mdi:home
    cards:
      - type: entities
        title: 평균 요약 (대기 3 / 토양 18)
        show_header_toggle: false
        entities:
          - entity: sensor.wasabi_air_temp_avg
            name: 대기 온도 평균 (3)
          - entity: sensor.wasabi_air_humidity_avg
            name: 대기 습도 평균 (3)
          - entity: sensor.wasabi_soil_temp_avg
            name: 토양 온도 평균 (18)
          - entity: sensor.wasabi_soil_moisture_avg
            name: 토양 습도 평균 (18)
          - entity: sensor.wasabi_soil_ec_avg
            name: 토양 EC 평균 (18)
          - entity: sensor.wasabi_soil_ph_avg
            name: 토양 pH 평균 (18)
          - entity: sensor.wasabi_valid_sensor_count
            name: 유효 토양 센서 수

      - type: entities
        title: g1-01 (대기+토양)
        entities:
          - sensor.wasabi_g1_01_air_temp
          - sensor.wasabi_g1_01_air_humidity
          - sensor.wasabi_soil_01_temp
          - sensor.wasabi_soil_01_moisture
          - sensor.wasabi_soil_01_ec
          - sensor.wasabi_soil_01_ph

      - type: entities
        title: g1-02 (대기+토양)
        entities:
          - sensor.wasabi_g1_02_air_temp
          - sensor.wasabi_g1_02_air_humidity
          - sensor.wasabi_soil_02_temp
          - sensor.wasabi_soil_02_moisture
          - sensor.wasabi_soil_02_ec
          - sensor.wasabi_soil_02_ph

      - type: entities
        title: g1-03 (대기+토양)
        entities:
          - sensor.wasabi_g1_03_air_temp
          - sensor.wasabi_g1_03_air_humidity
          - sensor.wasabi_soil_03_temp
          - sensor.wasabi_soil_03_moisture
          - sensor.wasabi_soil_03_ec
          - sensor.wasabi_soil_03_ph

      - type: entities
        title: g2-01 ~ g2-15 (토양 15 노드)
        entities:
          - sensor.wasabi_soil_04_temp
          - sensor.wasabi_soil_05_temp
          - sensor.wasabi_soil_06_temp
          - sensor.wasabi_soil_07_temp
          - sensor.wasabi_soil_08_temp
          - sensor.wasabi_soil_09_temp
          - sensor.wasabi_soil_10_temp
          - sensor.wasabi_soil_11_temp
          - sensor.wasabi_soil_12_temp
          - sensor.wasabi_soil_13_temp
          - sensor.wasabi_soil_14_temp
          - sensor.wasabi_soil_15_temp
          - sensor.wasabi_soil_16_temp
          - sensor.wasabi_soil_17_temp
          - sensor.wasabi_soil_18_temp

      - type: entities
        title: g3 배수 수위
        entities:
          - sensor.wasabi_g3_01_water_level
          - sensor.wasabi_g3_01_distance

      - type: entities
        title: g4 수중 환경
        entities:
          - sensor.wasabi_g4_01_water_temp
          - sensor.wasabi_g4_01_water_ph
          - sensor.wasabi_g4_01_water_ec
          - sensor.wasabi_g4_01_water_tds

      - type: entities
        title: g5 밸브 제어
        entities:
          - switch.wasabi_g5_01_valve

      - type: entities
        title: g6 액추에이터 제어
        entities:
          - switch.wasabi_irrigation_pump
          - switch.wasabi_drainage_pump
          - switch.wasabi_ceiling_fan
          - switch.wasabi_led_light

      - type: entities
        title: g7 조명 제어
        entities:
          - switch.wasabi_g7_01_light

      - type: entities
        title: 비상 제어
        entities:
          - button.wasabi_emergency_stop
          - button.wasabi_emergency_release
